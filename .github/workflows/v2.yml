name: TurboTab v2

# TurboTab v2 (turbotab/core, turbotab/server, turbotab/frontend, turbotab/deploy). Classic's
# workflows are ci.yml, deploy.yml and release.yml; this one does not replace them.
#
# Two tiers (audit of 2026-10-09, recommendation 7); turbotab/core/tests/test_ci_tiers.py checks
# the split:
#   FAST  this file, on every push and pull request, under ten minutes: the frontend's type
#         checks, lint and vitest; every core and server test but the acceptance suite and the
#         few marked slow, guarantee tests included, in parallel shards; the server image; the
#         launchers, with the numerics check on Windows (the audit's section 3.4).
#   FULL  v2-full.yml, on every push to turbotab-next or ci/full*, every pull request to main and
#         nightly: the whole core and server suite (50 minutes) and the browser tests.
# Every pip install uses turbotab/server/constraints.txt (its header says how to update it).

on:
  push:
    branches: [turbotab-next, "ci/**"]   # ci/** lets a fix iterate on Linux and Windows runners
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A push cancels only the push before it.
  group: v2-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  fast-tests:
    name: fast tests (${{ matrix.shard }})
    # Every test but the acceptance suite and the few marked slow, in parallel shards so that each
    # stays under ten minutes. A new test file lands in the shard whose paths hold it, and the
    # shards together run each test once (turbotab/core/tests/test_ci_tiers.py).
    strategy:
      fail-fast: false
      matrix:
        include:
          # Test time on a developer machine (CI takes about 2.5 times as long): about 260 s
          # each, but the last at 100 s; test_modeling.py alone took 360 s, so it is split.
          - shard: server
            paths: turbotab/server
          - shard: core
            paths: turbotab/core --ignore=turbotab/core/tests/acceptance --ignore=turbotab/core/tests/test_modeling.py
          - shard: models, the leakage and cross-validation guarantees
            paths: turbotab/core/tests/test_modeling.py -k "fitted_step_sees_only or independent_cross_validate"
          - shard: models, the rest
            paths: turbotab/core/tests/test_modeling.py -k "not (fitted_step_sees_only or independent_cross_validate)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TURBOTAB_WORKERS: "2"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            turbotab/server/requirements.txt
            turbotab/server/requirements-dev.txt
            turbotab/server/constraints.txt

      - name: Install the Python dependencies
        run: |
          python -m pip install -c turbotab/server/constraints.txt \
            -r turbotab/server/requirements.txt -r turbotab/server/requirements-dev.txt

      - name: Fast core and server tests
        # The acceptance suite, whose journeys fit many models, and the tests marked slow run in
        # the full tier (v2-full.yml). On failure, the failing tests become annotations, which
        # anyone can read (logs need admin).
        run: |
          python -m pytest ${{ matrix.paths }} -m "not slow" -q -n 2 -rfE --junitxml=pytest-report.xml || {
            python .github/scripts/annotate_failures.py pytest-report.xml
            exit 1
          }

  frontend:
    name: frontend check (tsc, eslint, vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: turbotab/frontend/package-lock.json

      - name: Frontend check
        working-directory: turbotab/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run check

  docker:
    name: server image (build, accounts, sign-in, upload)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: |
          set -o pipefail
          docker build --progress=plain -f turbotab/deploy/Dockerfile -t turbotab:ci . 2>&1 | tee build.log

      - name: Report the build's failure as annotations
        # The log needs admin to read; an annotation anyone can.
        if: failure()
        run: |
          if [ -f build.log ]; then
            echo "::error title=Image build (last 40 lines)::$(tail -n 40 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          else
            echo "::error title=Image build::build.log was not written"
          fi

      - name: Create an account
        run: |
          mkdir -p cfg
          sudo chown 10001:10001 cfg   # the image's turbotab user writes and reads the users file
          password="ci-$(openssl rand -hex 12)"
          echo "::add-mask::$password"
          echo "TT_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "$password" | docker run --rm -i -v "$PWD/cfg:/etc/turbotab" turbotab:ci \
            python -m turbotab.server.users add ci --password-stdin
          docker run --rm -v "$PWD/cfg:/etc/turbotab:ro" turbotab:ci python -m turbotab.server.users list

      - name: Run it
        run: |
          docker run -d --name turbotab -p 8787:8787 \
            -v "$PWD/cfg:/etc/turbotab:ro" -v turbotab-data:/data turbotab:ci
          for _ in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8787/healthz && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8787/healthz
          test "$(docker exec turbotab id -u)" = 10001   # not root

      - name: Without a session, every kind of request is refused
        run: |
          base=http://127.0.0.1:8787
          for path in /api/health /api/projects /api/projects/p0123456789 \
                      /api/projects/p0123456789/events /api/projects/p0123456789/export; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base$path")
            echo "GET $path -> $code"
            test "$code" = 401
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -F "file=@turbotab/sample_data/dietary_recalls.csv" \
            "$base/api/projects/upload")
          echo "POST /api/projects/upload -> $code"
          test "$code" = 401
          code=$(curl -s -o /dev/null -w '%{http_code}' "$base/")
          echo "GET / -> $code (to the sign-in page)"
          test "$code" = 303
          code=$(curl -s -o /dev/null -w '%{http_code}' --data-urlencode "username=ci" \
            --data-urlencode "password=not-the-password" "$base/login")
          echo "POST /login with a wrong password -> $code"
          test "$code" = 401

      - name: Sign in over HTTP, check health, upload a CSV
        run: |
          base=http://127.0.0.1:8787
          code=$(curl -s -o /dev/null -w '%{http_code}' -c jar.txt --data-urlencode "username=ci" \
            --data-urlencode "password=$TT_PASSWORD" --data-urlencode "next=/" "$base/login")
          echo "POST /login -> $code"
          test "$code" = 303
          curl -fsS -b jar.txt "$base/api/health" | tee health.json
          python3 -c "import json; h = json.load(open('health.json')); assert (h['mode'], h['user'], h['auth']) == ('server', 'ci', 'password'), h"
          pid=$(curl -fsS -b jar.txt -F "file=@turbotab/sample_data/dietary_recalls.csv" \
            "$base/api/projects/upload" | python3 -c "import json, sys; print(json.load(sys.stdin)['id'])")
          echo "uploaded as $pid"
          for _ in $(seq 1 120); do
            status=$(curl -fsS -b jar.txt "$base/api/projects/$pid" | python3 -c "import json, sys; v = json.load(sys.stdin); print(v['stages']['ingest']['status'], v['stages']['profile']['status'], v['summary']['n_rows'])")
            echo "$status"
            test "$status" = "fresh fresh 600" && break
            sleep 2
          done
          test "$status" = "fresh fresh 600"
          docker exec turbotab test -f "/data/users/ci/projects/$pid/project.json"   # the user's own workspace
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -b jar.txt "$base/logout")
          test "$code" = 303
          code=$(curl -s -o /dev/null -w '%{http_code}' -b jar.txt "$base/api/health")
          echo "after signing out: GET /api/health -> $code"
          test "$code" = 401

      - name: The container's health check passes
        run: |
          for _ in $(seq 1 60); do
            state=$(docker inspect -f '{{.State.Health.Status}}' turbotab)
            echo "$state"
            test "$state" = healthy && exit 0
            sleep 3
          done
          exit 1

      - name: Server log
        if: always()
        run: docker logs turbotab || true

  launcher:
    name: launcher (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      TURBOTAB_WORKERS: "2"
    steps:
      - uses: actions/checkout@v4

      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # the oldest Python TurboTab supports

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: First start (sets up, then health, an upload, a clean stop)
        if: runner.os == 'macOS'
        shell: bash
        env:
          TURBOTAB_HOME: ${{ runner.temp }}/turbotab-home
          TURBOTAB_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          test -x "turbotab/deploy/Start TurboTab.command"
          "turbotab/deploy/Start TurboTab.command" --smoke

      - name: Second start (set up already; seconds)
        if: runner.os == 'macOS'
        shell: bash
        env:
          TURBOTAB_HOME: ${{ runner.temp }}/turbotab-home
          TURBOTAB_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          "turbotab/deploy/Start TurboTab.command" --smoke | tee second.log
          grep -q "Python environment: up to date" second.log
          grep -q "interface: built" second.log

      - name: First start (sets up, then health, an upload, a clean stop)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          TURBOTAB_HOME: ${{ runner.temp }}\turbotab-home
          TURBOTAB_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          call "turbotab\deploy\Start TurboTab.bat" --smoke > first-start.log 2>&1
          set rc=%errorlevel%
          type first-start.log
          exit /b %rc%

      - name: Report the first start's failure as annotations
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path first-start.log) {
            $tail = (Get-Content first-start.log -Tail 40) -join "%0A"
            Write-Output "::error title=Windows launcher, first start (last 40 lines)::$tail"
          } else { Write-Output "::error title=Windows launcher::first-start.log was not written" }

      - name: Second start (set up already; seconds)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TURBOTAB_HOME: ${{ runner.temp }}\turbotab-home
          TURBOTAB_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          & ".\turbotab\deploy\Start TurboTab.bat" --smoke | Tee-Object -FilePath second.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Quiet "Python environment: up to date" second.log)) { exit 1 }
          if (-not (Select-String -Quiet "interface: built" second.log)) { exit 1 }

      - name: Numerics on Windows (the WP7 prediction results to 1e-9, the elastic net's penalty)
        # The audit of 2026-10-09 (section 3.4): the check held on Linux only. The same references
        # and the same 1e-9 here, on the third platform, on every push (a few minutes).
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install -c turbotab/server/constraints.txt -r turbotab/server/requirements.txt -r turbotab/server/requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest "turbotab/core/tests/acceptance/test_wp7_missing_data.py::test_2_prediction_results_reproduce_todays_to_1e_9" "turbotab/core/tests/acceptance/test_wp7_missing_data.py::test_2_the_linear_scores_match_scikit_learn_alone" turbotab/core/tests/test_elastic_net_penalty.py -q -rfE --junitxml=pytest-report.xml
          if ($LASTEXITCODE -ne 0) {
            python .github/scripts/annotate_failures.py pytest-report.xml
            exit 1
          }
