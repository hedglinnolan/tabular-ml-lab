name: Deploy Tabular ML Lab

# Triggered after CI passes on main. Gating deploys on CI ensures broken
# Tier 1+2 tests do not ship to the live demo at app.tabularml.dev.
on:
  workflow_run:
    workflows: ["CI — Tier 1 + 2 Tests"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, clawserver]
    steps:
      - name: Pull latest code
        run: |
          cd /home/claw/.openclaw/workspace/glucose-mlp-interactive
          git pull origin main

      - name: Install LaTeX (for PDF compilation)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra

      - name: Update dependencies
        run: |
          cd /home/claw/.openclaw/workspace/glucose-mlp-interactive
          ./venv/bin/pip install -r requirements.txt

      - name: Restart service
        run: |
          sudo systemctl restart tabular-ml-lab

      - name: Wait for service to come up
        timeout-minutes: 2
        run: |
          until curl -sf http://localhost:8501/_stcore/health | grep -q ok; do
            sleep 1
          done

      - name: E2E smoke test against live service
        timeout-minutes: 5
        run: |
          cd /home/claw/.openclaw/workspace/glucose-mlp-interactive
          ./venv/bin/python scripts/integration_test.py
