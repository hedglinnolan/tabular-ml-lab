name: CI — Tier 1 + 2 Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install pdflatex (for PDF round-trip integration test)
        # Match deploy.yml's TeX package set so CI compiles the same manuscript
        # the live server does (the manuscript template uses adjustbox and
        # microtype, which live in texlive-latex-extra).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'pytest>=7,<9' 'pytest-timeout>=2'

      - name: Tier 1 — Unit + Workflow tests
        run: |
          python -m pytest tests/ --ignore=tests/integration -q --timeout=60

      - name: Tier 2 — Streamlit AppTest integration + PDF round-trip
        run: |
          python -m pytest tests/integration -q --timeout=120
