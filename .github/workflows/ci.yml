name: CI — Tier 1 + 2 Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite is ~2,650 tests plus a LaTeX install; 10 minutes stopped
    # fitting when the paper-risk sprint tripled the test count.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install pdflatex (for PDF round-trip integration test)
        # Match the deploy environment's TeX package set so CI compiles the
        # same manuscript the live server does (manuscript template uses
        # adjustbox and microtype, which live in texlive-latex-extra).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'pytest>=7,<9' 'pytest-timeout>=2'

      - name: Tier 1 — Unit + Workflow tests
        # The two nested-suite meta-tests re-run the ENTIRE suite in
        # subprocesses (order-independence; every-FIXED-ledger-row-names-a-
        # running-test, marked timeout(2700)). They are a local/nightly gate
        # by construction — inside a bounded CI job they can only time the
        # job out, which reads as a test failure it is not. Every documented
        # local invocation (docs/audit/RESUME.md) excludes them the same way.
        # OMP_NUM_THREADS=1: sklearn's and torch's OpenMP runtimes share this
        # process; unpinned they can crash it outright (measured: pytest dies
        # with a segfault ~40% in, which is what a 124-second "failure" of a
        # 2,600-test tier was).
        run: |
          OMP_NUM_THREADS=1 python -m pytest tests/ --ignore=tests/integration \
            --ignore=tests/test_suite_is_order_independent.py \
            --ignore=tests/test_a_fixed_row_names_a_test_that_actually_runs.py \
            --ignore=tests/test_nn_modernization.py \
            -q --timeout=120

      - name: Tier 1b — NN (torch) tests in a fresh interpreter
        # The one file that RUNS torch ops. In a process that has already
        # loaded a thousand tests' worth of native libraries and AppTest
        # threads, torch's third forward pass segfaults (macOS and Linux
        # both); in a fresh interpreter the same 22 tests pass in seconds.
        # Isolation is the fix — the tests themselves are sound.
        run: |
          OMP_NUM_THREADS=1 python -m pytest tests/test_nn_modernization.py \
            -q --timeout=120

      - name: Tier 2 — Streamlit AppTest integration + PDF round-trip
        run: |
          python -m pytest tests/integration -q --timeout=120

  # ── Deploy ────────────────────────────────────────────────────────────
  # Runs only after test passes, only on direct pushes to main (not PRs).
  # Using `needs: test` rather than a separate workflow_run-triggered file
  # because workflow_run dispatch was unreliable in our environment --
  # `needs` is a simple in-workflow dependency GitHub honors deterministically.
  deploy:
    needs: test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, clawserver]
    steps:
      - name: Pull latest code
        run: |
          cd /home/claw/.openclaw/workspace/glucose-mlp-interactive
          git pull origin main

      - name: Install LaTeX (for PDF compilation)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra

      - name: Update dependencies
        run: |
          cd /home/claw/.openclaw/workspace/glucose-mlp-interactive
          ./venv/bin/pip install -r requirements.txt

      - name: Restart service
        run: |
          sudo systemctl restart tabular-ml-lab

      - name: Wait for service to come up
        timeout-minutes: 2
        run: |
          until curl -sf http://localhost:8501/_stcore/health | grep -q ok; do
            sleep 1
          done

      - name: E2E smoke test against live service
        timeout-minutes: 5
        run: |
          cd /home/claw/.openclaw/workspace/glucose-mlp-interactive
          ./venv/bin/python scripts/integration_test.py
