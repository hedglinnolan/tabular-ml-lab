# A one-off probe, on the probe/windows branch only and never merged (2026-10-20): the two quest
# journeys a researcher walks (NHANES glucose under Predict, an own CSV), each on a fresh local
# server, on a Windows runner. The first answer on a Windows laptop stopped with AttributeError
# (os.pread), and no Windows job had ever posted a decision, so this finds what else is waiting.
name: windows probe
on:
  push:
    branches: [probe/windows]
  workflow_dispatch:

jobs:
  journeys:
    name: quest journeys on Windows (real server, Playwright)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TURBOTAB_WORKERS: "2"
      OMP_NUM_THREADS: "2"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the server, the frontend and Chromium
        run: |
          python -m pip install -c turbotab/server/constraints.txt -r turbotab/server/requirements.txt
          cd turbotab/frontend
          npm ci --no-audit --no-fund
          npx playwright install chromium

      - name: Build the frontend the server serves
        working-directory: turbotab/frontend
        run: npm run build

      - name: The quest journeys, each on a fresh local server
        run: |
          logs="$RUNNER_TEMP/servers"
          mkdir -p "$logs"
          status=0
          for spec in quest-nhanes-predict quest-own-csv; do
            port=$(python -c "import socket; s=socket.socket(); s.bind(('127.0.0.1',0)); print(s.getsockname()[1])")
            home="$RUNNER_TEMP/home-$spec"
            mkdir -p "$home"
            TURBOTAB_HOME="$(cygpath -w "$home")" python -m turbotab.server --mode local --port "$port" > "$logs/$spec.log" 2>&1 &
            server=$!
            for i in $(seq 1 90); do curl -sf "http://127.0.0.1:$port/api/health" > /dev/null && break; sleep 1; done
            if ! (cd turbotab/frontend && E2E_BASE_URL="http://127.0.0.1:$port" \
              npx playwright test "$spec" --output "test-results/$spec" --reporter=line,github); then
              status=1
            fi
            # Every traceback the server printed, as annotations anyone can read through the API.
            python - "$logs/$spec.log" "$spec" <<'EOF'
          import sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read().replace("\r", "")
          blocks = text.split("Traceback (most recent call last):")[1:]
          seen = set()
          for b in blocks:
              lines = [l for l in b.strip().splitlines() if l.strip()]
              last = lines[-1] if lines else "?"
              if last in seen:
                  continue
              seen.add(last)
              frames = [l.strip() for l in lines if l.strip().startswith("File ") and "site-packages" not in l][-6:]
              msg = "\n".join(frames + [last])[:3000]
              print(f"::error title=server traceback in {sys.argv[2]}::" + msg.replace("%", "%25").replace("\n", "%0A"))
          if not blocks:
              tail = "\n".join(text.splitlines()[-30:])[:3000]
              print(f"::notice title=server log tail of {sys.argv[2]} (no traceback)::" + tail.replace("%", "%25").replace("\n", "%0A"))
          EOF
            kill "$server" 2>/dev/null || true
          done
          mkdir -p turbotab/frontend/test-results/servers
          cp "$logs"/*.log turbotab/frontend/test-results/servers/
          exit $status

      - name: Keep the traces and the servers' logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-probe-traces
          path: turbotab/frontend/test-results
          retention-days: 7
