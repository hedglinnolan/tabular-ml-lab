# TurboTab v2 on a university server: an example to copy and adapt (docs/turbotab-next/DEPLOY.md).
#
#   cp turbotab/deploy/docker-compose.example.yml docker-compose.turbotab.yml
#   docker compose -f docker-compose.turbotab.yml build
#   mkdir -p turbotab-config && sudo chown 10001:10001 turbotab-config   # the image's user
#   docker run --rm -it -v "$PWD/turbotab-config:/etc/turbotab" turbotab:2 \
#       python -m turbotab.server.users add alice
#   docker compose -f docker-compose.turbotab.yml up -d
#
# TLS: TurboTab speaks plain HTTP. Put it behind a reverse proxy that terminates TLS (nginx,
# Caddy, Apache, or the institution's load balancer), publish the port on 127.0.0.1 only as below,
# and list the proxy's address in TURBOTAB_TRUSTED_PROXIES so the client address and https are
# read from its X-Forwarded-For and X-Forwarded-Proto. Keep TURBOTAB_SECURE_COOKIES=1 behind TLS.
#
# This file signs people in with passwords. For single sign-on, see the end of the file: it is
# not a one-word change.

services:
  turbotab:
    build:
      context: .
      dockerfile: turbotab/deploy/Dockerfile
    image: turbotab:2
    ports:
      - "127.0.0.1:8787:8787"     # the TLS proxy on this host connects here
    networks:
      - turbotab
    environment:
      TURBOTAB_AUTH: password
      TURBOTAB_SECURE_COOKIES: "1"  # cookies only over https (the proxy's)
      # The TLS proxy on this host comes in through the published port, so TurboTab sees it as
      # the gateway of its network (below), and believes its X-Forwarded-For and -Proto. Every
      # other process on the host comes in from the same address. In password mode that only
      # lets them choose the address the per-address sign-in limit counts and say a request was
      # https; the per-account limit still holds. A TLS proxy in a container on this network:
      # list its address instead.
      TURBOTAB_TRUSTED_PROXIES: "172.31.87.1"
      TURBOTAB_WORKERS: "4"         # job worker processes shared by every user
      # TURBOTAB_MEMORY_BUDGET: 24G  # default: half the memory free at start
      # TURBOTAB_SESSION_IDLE_MINUTES: "120"
      # TURBOTAB_SESSION_MAX_HOURS: "12"
    volumes:
      # Every user's workspace: users/<name>/projects/… Back this up.
      - turbotab-data:/data
      # The users file, read-only. The folder is mounted rather than the file so that a users
      # file rewritten on the host (python -m turbotab.server.users) is seen without a restart.
      - ./turbotab-config:/etc/turbotab:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

networks:
  turbotab:  # TurboTab's own network, so the addresses above are known
    ipam:
      config:
        - subnet: 172.31.87.0/24  # if it overlaps a network you have, change 172.31.87 throughout
          gateway: 172.31.87.1

volumes:
  turbotab-data:

# ── Single sign-on instead of passwords ─────────────────────────────────────
#
# With TURBOTAB_AUTH=proxy, TurboTab believes the user named in TURBOTAB_PROXY_HEADER on any
# request from TURBOTAB_TRUSTED_PROXIES. Whatever can connect from a trusted address can sign in
# as anyone. A proxy on the host that comes in through a published port arrives from the gateway,
# as every other process and container on the host does, and TurboTab cannot tell them apart. So
# publish no port for TurboTab and do not trust the gateway. Run the SSO proxy as a service on
# this network with an address of its own, trust that address alone, and let the proxy face the
# users. TurboTab refuses to start in proxy mode if a trusted network holds more than 256
# addresses. The changes to the services above:
#
#   services:
#     turbotab:
#       # delete the ports: entry
#       environment:
#         TURBOTAB_AUTH: proxy
#         TURBOTAB_TRUSTED_PROXIES: "172.31.87.10"   # the sso service, and nothing else
#         TURBOTAB_PROXY_HEADER: X-Forwarded-User    # the header the SSO proxy sets
#     sso:                     # oauth2-proxy, a Shibboleth SP, Keycloak's gatekeeper, ...
#       image: your-institutions-sso-proxy
#       ports:
#         - "443:8443"         # it terminates TLS; its upstream is http://turbotab:8787
#       networks:
#         turbotab:
#           ipv4_address: 172.31.87.10
#
# The proxy must set the header on every request and overwrite any copy a browser sent.
