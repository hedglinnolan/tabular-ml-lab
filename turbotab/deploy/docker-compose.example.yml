# TurboTab v2 on a university server: an example to copy and adapt (docs/turbotab-next/DEPLOY.md).
#
#   cp turbotab/deploy/docker-compose.example.yml docker-compose.turbotab.yml
#   docker compose -f docker-compose.turbotab.yml build
#   mkdir -p turbotab-config && sudo chown 10001:10001 turbotab-config   # the image's user
#   docker run --rm -it -v "$PWD/turbotab-config:/etc/turbotab" turbotab:2 \
#       python -m turbotab.server.users add alice
#   docker compose -f docker-compose.turbotab.yml up -d
#
# TLS: TurboTab speaks plain HTTP. Put it behind a reverse proxy that terminates TLS (nginx,
# Caddy, Apache, or the institution's load balancer), publish the port on 127.0.0.1 only as below,
# and list the proxy's address in TURBOTAB_TRUSTED_PROXIES so the client address and https are
# read from its X-Forwarded-For and X-Forwarded-Proto. Keep TURBOTAB_SECURE_COOKIES=1 behind TLS.
#
# Single sign-on instead of passwords: set TURBOTAB_AUTH=proxy and TURBOTAB_PROXY_HEADER to the
# header the SSO proxy sets (for example X-Forwarded-User). TurboTab then reads the user from that
# header only on requests from TURBOTAB_TRUSTED_PROXIES, and refuses to start without that list.

services:
  turbotab:
    build:
      context: .
      dockerfile: turbotab/deploy/Dockerfile
    image: turbotab:2
    ports:
      - "127.0.0.1:8787:8787"     # the TLS proxy on this host connects here
    environment:
      TURBOTAB_AUTH: password       # or: proxy
      TURBOTAB_SECURE_COOKIES: "1"  # cookies only over https (the proxy's)
      # The proxy's address as the container sees it: Docker's bridge gateway for a proxy on this
      # host (find it with: docker network inspect bridge), or the proxy container's network.
      TURBOTAB_TRUSTED_PROXIES: "172.16.0.0/12"
      # TURBOTAB_PROXY_HEADER: X-Forwarded-User   # with TURBOTAB_AUTH=proxy
      TURBOTAB_WORKERS: "4"         # job worker processes shared by every user
      # TURBOTAB_MEMORY_BUDGET: 24G  # default: half the memory free at start
      # TURBOTAB_SESSION_IDLE_MINUTES: "120"
      # TURBOTAB_SESSION_MAX_HOURS: "12"
    volumes:
      # Every user's workspace: users/<name>/projects/… Back this up.
      - turbotab-data:/data
      # The users file, read-only. The folder is mounted rather than the file so that a users
      # file rewritten on the host (python -m turbotab.server.users) is seen without a restart.
      - ./turbotab-config:/etc/turbotab:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  turbotab-data:
